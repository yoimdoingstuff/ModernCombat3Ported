name: Multi-Platform CI & Release Packaging

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: mc3ported-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-portal:
    name: Web Portal Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck / Lint
        run: npm run lint

      - name: Build Web Portal
        run: npm run build

  native-build:
    name: Native ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            archive: mc3-windows-x64.zip
            binary_ext: .exe
          - os: ubuntu-latest
            compiler: gcc
            archive: mc3-linux-x64.tar.gz
            binary_ext: ""
          - os: macos-latest
            compiler: clang
            archive: mc3-macos-universal.zip
            binary_ext: ""

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsdl2-dev

      - name: Setup macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja sdl2

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cd native-runtime
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMC3_ENABLE_TESTS=ON `
            -DMC3_ENABLE_TOOLS=ON

      - name: Configure CMake (POSIX)
        if: runner.os != 'Windows'
        run: |
          cd native-runtime
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMC3_ENABLE_TESTS=ON \
            -DMC3_ENABLE_TOOLS=ON

      - name: Compile Executables & Tools
        run: |
          cd native-runtime
          cmake --build build --config Release --parallel 2

      - name: Execute Runtime Tests
        run: |
          cd native-runtime
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Release Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd native-runtime
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "build\bin\Release\mc3.exe") {
            Copy-Item "build\bin\Release\*.exe" -Destination "dist\"
          } elseif (Test-Path "build\bin\mc3.exe") {
            Copy-Item "build\bin\*.exe" -Destination "dist\"
          } elseif (Test-Path "build\Release\mc3.exe") {
            Copy-Item "build\Release\*.exe" -Destination "dist\"
          }
          if (Test-Path "README.md") { Copy-Item "README.md" "dist\" }
          if (Test-Path "agents.md") { Copy-Item "agents.md" "dist\" }
          Compress-Archive -Path dist\* -DestinationPath ..\${{ matrix.archive }} -Force

      - name: Package Release Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd native-runtime
          mkdir -p dist
          find build -maxdepth 3 -type f \( -name "mc3" -o -name "mc3inspect" -o -name "mc3builder" \) -exec cp {} dist/ \;
          [ -f README.md ] && cp README.md dist/
          [ -f agents.md ] && cp agents.md dist/
          chmod +x dist/mc3 dist/mc3inspect dist/mc3builder 2>/dev/null || true
          tar -czvf ../${{ matrix.archive }} -C dist .

      - name: Package Release Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd native-runtime
          mkdir -p dist
          find build -maxdepth 3 -type f \( -name "mc3" -o -name "mc3inspect" -o -name "mc3builder" \) -exec cp {} dist/ \;
          [ -f README.md ] && cp README.md dist/
          [ -f agents.md ] && cp agents.md dist/
          chmod +x dist/mc3 dist/mc3inspect dist/mc3builder 2>/dev/null || true
          (cd dist && zip -r ../../${{ matrix.archive }} .)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: ${{ matrix.archive }}
          if-no-files-found: warn
