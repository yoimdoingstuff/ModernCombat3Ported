name: Multi-Platform CI & Release Packaging

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: mc3ported-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            archive: mc3-windows-x64.zip
            binary_ext: .exe
          - os: ubuntu-latest
            compiler: gcc
            archive: mc3-linux-x64.tar.gz
            binary_ext: ""
          - os: macos-latest
            compiler: clang
            archive: mc3-macos-universal.zip
            binary_ext: ""

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsdl2-dev

      - name: Setup macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja sdl2 || true

      - name: Setup MSVC Developer Environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMC3_ENABLE_TESTS=ON -DMC3_ENABLE_TOOLS=ON -DMC3_ENABLE_DYNARMIC=OFF

      - name: Configure CMake (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMC3_ENABLE_TESTS=ON -DMC3_ENABLE_TOOLS=ON -DMC3_ENABLE_DYNARMIC=OFF

      - name: Compile Executables & Tools
        run: cmake --build build --config Release --parallel 2

      - name: Execute Runtime Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Release Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Include mc3.exe,mc3inspect.exe,mc3builder.exe | Copy-Item -Destination dist\ -Force
          if (Test-Path "README.md") { Copy-Item "README.md" "dist\" }
          if (Test-Path "agents.md") { Copy-Item "agents.md" "dist\" }
          Get-ChildItem dist
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive }} -Force

      - name: Package Release Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          find build -type f \( -name "mc3" -o -name "mc3inspect" -o -name "mc3builder" \) -exec cp -f {} dist/ \;
          [ -f README.md ] && cp README.md dist/
          [ -f agents.md ] && cp agents.md dist/
          chmod +x dist/mc3 dist/mc3inspect dist/mc3builder 2>/dev/null || true
          ls -la dist/
          tar -czvf ${{ matrix.archive }} -C dist .

      - name: Package Release Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          find build -type f \( -name "mc3" -o -name "mc3inspect" -o -name "mc3builder" \) -exec cp -f {} dist/ \;
          [ -f README.md ] && cp README.md dist/
          [ -f agents.md ] && cp agents.md dist/
          chmod +x dist/mc3 dist/mc3inspect dist/mc3builder 2>/dev/null || true
          ls -la dist/
          (cd dist && zip -r ../${{ matrix.archive }} .)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: ${{ matrix.archive }}
          if-no-files-found: warn
